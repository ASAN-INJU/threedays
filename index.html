<script>

/* =========================
   체크박스
========================= */

const checks =
    document.querySelectorAll(".check");

const done =
    document.getElementById("done");

const total =
    document.getElementById("total");


/* 전체 개수 */
total.textContent =
    checks.length;


/* =========================
   저장된 체크 불러오기
========================= */

checks.forEach((check,index)=>{

    const saved =
        localStorage.getItem(
            "clean_volunteer_" + index
        );

    if(saved === "true"){
        check.checked = true;
    }

});


/* =========================
   업데이트
========================= */

function update(){

    let count = 0;

    checks.forEach((check,index)=>{

        if(check.checked){
            count++;
        }

        localStorage.setItem(
            "clean_volunteer_" + index,
            check.checked
        );

    });

    done.textContent =
        count;

}


/* =========================
   체크 변경
========================= */

checks.forEach(check=>{

    check.addEventListener(
        "change",
        update
    );

});


/* =========================
   전체 완료
========================= */

function checkAll(){

    checks.forEach(check=>{
        check.checked = true;
    });

    update();

}


/* =========================
   초기화
========================= */

function resetAll(){

    if(
        confirm(
            "모든 자원봉사 완료 표시를 초기화할까요?"
        )
    ){

        checks.forEach(check=>{
            check.checked = false;
        });

        update();

    }

}


/* 최초 실행 */
update();

</script>
