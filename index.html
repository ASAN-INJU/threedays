<body>

<!-- =========================
     상단 제목
========================= -->

<div class="header">

    <div class="header-title">
        영원한 행복 · 지역대회
    </div>

    <div class="header-sub">
        자원봉사 일정 및 참여 확인
    </div>

</div>


<div class="container">

    <!-- =========================
         행사 안내
    ========================= -->

    <div class="event-box">

        <div class="event-title">
            📋 자원봉사 일정
        </div>

        <div class="event-info">
            금요일 · 토요일 · 일요일
            &nbsp; | &nbsp;
            참여 완료 시 ✓ 체크
        </div>

    </div>


    <!-- =========================
         자원봉사 일정표
    ========================= -->

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th class="col-group">
                        조
                    </th>

                    <th class="col-time">
                        담당 시간
                    </th>

                    <th class="col-name">
                        자원봉사자
                    </th>

                    <th class="col-day friday">
                        금
                    </th>

                    <th class="col-day saturday">
                        토
                    </th>

                    <th class="col-day sunday">
                        일
                    </th>

                </tr>

            </thead>


            <tbody>

                <!-- =====================
                     1조
                ====================== -->

                <tr>

                    <td class="group">
                        1조
                    </td>

                    <td class="time">
                        오전<br>
                        09:00~12:00
                    </td>

                    <td class="names">

                        <span class="person p1">
                            강경운
                        </span>

                        <span class="person p2">
                            김○○
                        </span>

                        <span class="person p3">
                            박○○
                        </span>

                    </td>

                    <td>
                        <input
                            type="checkbox"
                            class="check"
                            data-day="금">
                    </td>

                    <td>
                        <input
                            type="checkbox"
                            class="check"
                            data-day="토">
                    </td>

                    <td>
                        <input
                            type="checkbox"
                            class="check"
                            data-day="일">
                    </td>

                </tr>


                <!-- =====================
                     2조
                ====================== -->

                <tr>

                    <td class="group">
                        2조
                    </td>

                    <td class="time">
                        오전<br>
                        09:00~12:00
                    </td>

                    <td class="names">

                        <span class="person p4">
                            이○○
                        </span>

                        <span class="person p5">
                            정○○
                        </span>

                        <span class="person p6">
                            최○○
                        </span>

                    </td>

                    <td>
                        <input
                            type="checkbox"
                            class="check"
                            data-day="금">
                    </td>

                    <td>
                        <input
                            type="checkbox"
                            class="check"
                            data-day="토">
                    </td>

                    <td>
                        <input
                            type="checkbox"
                            class="check"
                            data-day="일">
                    </td>

                </tr>


                <!-- =====================

                <tr>

                    <td class="group">
                        3조
                    </td>

                    <td class="time">
                        오후<br>
                        13:00~16:00
                    </td>

                    <td class="names">

                        <span class="person p7">
                            윤○○
                        </span>

                        <span class="person p8">
                            한○○
                        </span>

                        <span class="person p1">
                            조○○
                        </span>

                    </td>

                        <input

                    </td>

                        </span>

            완료

                class="progress-number">
                0
            </span>

            /

            <span id="totalCount">
                0
            </span>

        </div>

                class="btn-all"
                onclick="checkAll()">

                전체 완료

            </button>

            </button>

<script>

/* ==========================================
   자원봉사 체크 기능
========================================== */

const checks =
    document.querySelectorAll(".check");

const doneCount =
    document.getElementById("doneCount");

const totalCount =
    document.getElementById("totalCount");


/* 전체 체크 개수 */

totalCount.textContent =
    checks.length;


/* ==========================================
   저장된 체크 상태 불러오기
========================================== */

checks.forEach((check,index)=>{

    const saved =
        localStorage.getItem(
            "volunteer_check_" + index
        );

    if(saved === "true"){

        check.checked = true;

    }

});


/* ==========================================
   완료 행 표시
========================================== */

function updateRows(){

    const rows =
        document.querySelectorAll(
            "tbody tr"
        );

    rows.forEach(row=>{

        const rowChecks =
            row.querySelectorAll(
                ".check"
            );

        let completed = true;

        rowChecks.forEach(check=>{

            if(!check.checked){

                completed = false;

            }

        });

        if(completed){

            row.classList.add(
                "completed"
            );

        }else{

            row.classList.remove(
                "completed"
            );

        }

    });

}


/* ==========================================
   상태 저장 + 완료 숫자
========================================== */

function update(){

    let count = 0;

    checks.forEach((check,index)=>{

        if(check.checked){

            count++;

        }

        localStorage.setItem(
            "volunteer_check_" + index,
            check.checked
        );

    });


    doneCount.textContent =
        count;

    updateRows();

}


/* ==========================================
   체크할 때마다 자동 저장
========================================== */

checks.forEach(check=>{

    check.addEventListener(
        "change",
        update
    );

});


/* ==========================================
   전체 완료
========================================== */

function checkAll(){

    checks.forEach(check=>{

        check.checked = true;

    });

    update();

}


/* ==========================================
   전체 초기화
========================================== */

function resetAll(){

    const ok =
        confirm(
            "금·토·일 자원봉사 완료 표시를 모두 초기화할까요?"
        );

    if(!ok){

        return;

    }


    checks.forEach(check=>{

        check.checked = false;

    });


    update();

}


/* ==========================================
   최초 실행
========================================== */

update();

</script>

</body>
</html>
