<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>영원한 행복 지역대회 청소 자원봉사</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    background:#f3f6fa;
    font-family:"Noto Sans KR",Arial,sans-serif;
    color:#222;
}

.container{
    max-width:700px;
    margin:auto;
}

.title{
    background:linear-gradient(135deg,#4f8cff,#7b61ff);
    color:white;
    padding:20px 10px;
    border-radius:18px;
    text-align:center;
    margin-bottom:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.title h1{
    margin:0;
    font-size:20px;
}

.title p{
    margin:6px 0 0;
    font-size:13px;
}

/* 표 */
.table-wrap{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th{
    background:#eef3f9;
    padding:11px 4px;
    font-size:13px;
    border-bottom:1px solid #dce3eb;
}

th:first-child{
    width:19%;
}

th:nth-child(2){
    width:43%;
}

th:nth-child(3),
th:nth-child(4),
th:nth-child(5){
    width:12.6%;
}

td{
    padding:13px 4px;
    text-align:center;
    border-bottom:1px solid #edf0f3;
    font-size:14px;
}

tr:last-child td{
    border-bottom:none;
}

/* 조 */
.group{
    font-weight:800;
    font-size:15px;
}

.time{
    font-size:13px;
    font-weight:600;
    line-height:1.5;
}

/* 이름 */
.name{
    text-align:left;
    font-weight:600;
    line-height:1.6;
    word-break:keep-all;
}

/* 토·일 표시 */
.weekend{
    font-weight:800;
}

/* 체크박스 */
.check{
    width:25px;
    height:25px;
    cursor:pointer;
    accent-color:#4f8cff;
}

/* 완료된 줄 */
.done{
    background:#f5fbf7;
}

.done .name{
    text-decoration:line-through;
    opacity:.6;
}

.footer{
    text-align:center;
    color:#8a949e;
    font-size:11px;
    margin:16px 0 5px;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>🌸 「영원한 행복」 지역대회</h1>
        <p>청소 자원봉사 참여표</p>
    </div>

    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>조</th>
                    <th>봉사자</th>
                    <th>금<br>요일</th>
                    <th>토<br>요일</th>
                    <th>일<br>요일</th>
                </tr>
            </thead>

            <tbody>

                <!-- 1조 -->
                <tr>
                    <td class="group">🩵 1조<br>
                        <span class="time">오전 회기 전</span>
                    </td>

                    <td class="name">
                        노을 · 노아민 ·<br>
                        강경운 (토·일) ·<br>
                        김영옥 (토·일)
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>
                </tr>

                <!-- 2조 -->
                <tr>
                    <td class="group">💚 2조<br>
                        <span class="time">오전 회기 중</span>
                    </td>

                    <td class="name">
                        문홍균 · 문정훈
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>
                </tr>

                <!-- 3조 -->
                <tr>
                    <td class="group">💛 3조<br>
                        <span class="time">휴회 시간</span>
                    </td>

                    <td class="name">
                        장미정 · 문수현 · 강세민
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>
                </tr>

                <!-- 4조 -->
                <tr>
                    <td class="group">🧡 4조<br>
                        <span class="time">오후 회기 중</span>
                    </td>

                    <td class="name">
                        김형욱 · 서혜정
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>

                    <td>
                        <input type="checkbox" class="check">
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <div class="footer">
        체크하면 참여 완료로 표시됩니다.
    </div>

</div>


<script>

/* 체크하면 완료 표시 */
document.querySelectorAll(".check").forEach(function(check){

    check.addEventListener("change",function(){

        const row = this.closest("tr");

        if(this.checked){
            row.classList.add("done");
        }else{
            row.classList.remove("done");
        }

    });

});

</script>

</body>
</html>
