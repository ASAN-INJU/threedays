<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>영원한 행복 지역대회 청소 자원봉사</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    background:#f3f6fa;
    font-family:"Noto Sans KR",Arial,sans-serif;
    color:#263238;
}

.container{
    max-width:600px;
    margin:auto;
}

.title{
    background:linear-gradient(135deg,#4f8cff,#7b61ff);
    color:white;
    padding:22px 15px;
    border-radius:20px;
    text-align:center;
    margin-bottom:16px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.title h1{
    margin:0;
    font-size:21px;
    line-height:1.4;
}

.title p{
    margin:7px 0 0;
    font-size:13px;
    opacity:.9;
}

.group{
    background:white;
    border-radius:18px;
    margin-bottom:13px;
    padding:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    border-left:7px solid;
}

.group1{border-color:#4f8cff;}
.group2{border-color:#35b978;}
.group3{border-color:#f0b429;}
.group4{border-color:#ff7a59;}

.group-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.group-name{
    font-size:18px;
    font-weight:800;
}

.time{
    background:#f1f4f8;
    padding:6px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:600;
}

.names{
    font-size:17px;
    line-height:1.8;
    font-weight:600;
    word-break:keep-all;
}

.weekend{
    color:#e05252;
    font-weight:800;
    white-space:nowrap;
}

.footer{
    text-align:center;
    color:#8a949e;
    font-size:11px;
    margin:18px 0 5px;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>🌸 「영원한 행복」 지역대회</h1>
        <p>청소 자원봉사</p>
    </div>

    <!-- 1조 -->
    <div class="group group1">
        <div class="group-top">
            <div class="group-name">🩵 1조</div>
            <div class="time">오전 회기 전</div>
        </div>

        <div class="names">
            노을 · 노아민 ·
            <span class="weekend">강경운 (토·일)</span> ·
            <span class="weekend">김영옥 (토·일)</span>
        </div>
    </div>

    <!-- 2조 -->
    <div class="group group2">
        <div class="group-top">
            <div class="group-name">💚 2조</div>
            <div class="time">오전 회기 중</div>
        </div>

        <div class="names">
            문홍균 · 문정훈
        </div>
    </div>

    <!-- 3조 -->
    <div class="group group3">
        <div class="group-top">
            <div class="group-name">💛 3조</div>
            <div class="time">휴회 시간</div>
        </div>

        <div class="names">
            장미정 · 문수현 · 강세민
        </div>
    </div>

    <!-- 4조 -->
    <div class="group group4">
        <div class="group-top">
            <div class="group-name">🧡 4조</div>
            <div class="time">오후 회기 중</div>
        </div>

        <div class="names">
            김형욱 · 서혜정
        </div>
    </div>

    <div class="footer">
        「영원한 행복」 지역대회 청소 자원봉사
    </div>

</div>

</body>
</html>
